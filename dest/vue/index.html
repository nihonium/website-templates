<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Vue TEST</title>
        <!-- Vue.js を読み込む -->
        <script src="https://cdn.jsdelivr.net/npm/vue/dist/vue.js"></script>
        <style>
            #app-1 .error
            {
                color: red;
            }

            #app-1 input
            {
                padding: 10px;
                border: 1px solid #000;
            }
        </style>
    </head>
    <body>
        <div id="app-1">
            <input type="text" v-model="message">
            <div class="error" v-if="error.require">必須項目です。</div>
            <div class="error" v-if="error.tooLong">長すぎます。</div>
        </div>
        <div id="app-101">
            <div v-text="message"></div>
            <div>{{ message }}</div>
        </div>
        <div id="app-102">
            <div v-text="message"></div>
            <div v-html="message"></div>
        </div>
        <div id="app-103">
            <input type="checkbox" @click="change" checked>
            <span v-show="seen">Hello!</span>
        </div>
        <div id="app-104">
            <input type="checkbox" @click="change" checked>
            <span v-if="seen2">Hello!</span>
        </div>
        <div id="app-105">
            <input type="checkbox" @click="change" checked>
            <span v-if="seen">Hello!</span>
            <span v-else>Bey!</span>
        </div>
        <div id="app-106">
            <input type="radio" name="app106-type" onclick="app106.type='A'" checked>
            <input type="radio" name="app106-type" onclick="app106.type='B'">
            <input type="radio" name="app106-type" onclick="app106.type='C'">
            <span v-if="type == 'A'">おはよう</span>
            <span v-else-if="type == 'B'">こんにちは</span>
            <span v-else>さようなら</span>
        </div>
        <div id="app-107">
            <ul>
                <li v-for="color in colorList">{{color}}</li>
            </ul>
        </div>
        <div id="app-108">
            <button type="button" v-on:click="hello">Hello</button>
            <button type="button" @click="hello">Hello</button>
        </div>
        <div id="app-109">
            <input type="button" v-bind:value="message">
            <input type="button" :value="message">
        </div>
        <div id="app-120" data-app-120>
            <input type="text" v-model="message">
            <div>message: {{message}}</div>
        </div>
        <script>
            var app120 = new Vue(
            {
                el: '[data-app-120]',
                data:
                {
                    message: 'Hello!'
                }
            })
        </script>
        <div id="app-121">
            <div v-pre>Message: {{message}}</div>
            <div>Message: {{message}}</div>
        </div>
        <script>
            var app121 = new Vue(
            {
                el: '#app-121',
                data:
                {
                    message: 'Hello'
                }
            })
        </script>
        <style>
            [v-cloak]
            {
                display: none;
            }
        </style>
        <div id="app-122">
            <button onclick="location.reload()">再表示</button>
            <div>Message: <span v-cloak>{{message}}</span></div>
            <div>Message: <span>{{message}}</span></div>
        </div>
        <script>
            window.setTimeout(function()
            {
                var app122 = new Vue(
                {
                    el: '#app-122',
                    data:
                    {
                        message: 'Hello'
                    }
                })
            }, 1000)
        </script>
        <div id="app-123">
            <input type="text" name="text1" v-model:value="message">
            <div>Message: <span v-once>{{message}}</span></div>
            <div>Message: <span>{{message}}</span></div>
        </div>
        <script>
            var app123 = new Vue(
            {
                el: '#app-123',
                data:
                {
                    message: 'Hello'
                }
            })
        </script>
        <div id="app-140">
            <my-element-140></my-element-140>
        </div>
        <script>
            Vue.component('my-element-140',
            {
                template: '<strong>hoge</strong>'
            })
            var app140 = new Vue(
            {
                el: '#app-140'
            })
        </script>
        <div id="app-141">
            <my-component-141></my-component-141>
        </div>
        <script>
            var MyComponent141 = Vue.extend(
            {
                template: '<strong>Hello!</strong>'
            })
            Vue.component('my-component-141', MyComponent141)
            var app141 = new Vue(
            {
                el: '#app-141',
            })
        </script>
        <div id="app-142">
            <div>{{msg2}}</div>
        </div>
        <script>
            var app142 = new Vue(
            {
                el: '#app-142',
                data:
                {
                    message: 'Hello!',
                    msg1: '',
                    msg2: '上海蟹食べたい',
                }
            })
            app142.msg2 = 'Bey!'
            console.log(app142.$el.textContent);
            Vue.nextTick(function()
            {
                console.log(app142.$el.textContent);
            })
        </script>
        <script>
            var app1 = new Vue(
            {
                el: '#app-1',
                watch:
                {
                    message: function(v, oldVal)
                    {
                        this.error.require = (v.length < 1) ? true : false;
                        this.error.tooLong = (v.length > 5) ? true : false;
                    }
                },
                data:
                {
                    message: 'Hello',
                    error:
                    {
                        require: false,
                        tooLong: false
                    }
                }
            });
            var app101 = new Vue(
            {
                el: '#app-101',
                data:
                {
                    message: 'Hello'
                }
            });
            var app102 = new Vue(
            {
                el: '#app-102',
                data:
                {
                    message: '<p>Hello!</p>'
                }
            });
            var app103 = new Vue(
            {
                el: '#app-103',
                data:
                {
                    seen: true
                },
                methods:
                {
                    change: function(e)
                    {
                        this.seen = e.target.checked;
                    }
                }
            });
            var app104 = new Vue(
            {
                el: '#app-104',
                data:
                {
                    seen2: true
                },
                methods:
                {
                    change: function(e)
                    {
                        this.seen2 = e.target.checked;
                    }
                }
            });
            var app105 = new Vue(
            {
                el: '#app-105',
                data:
                {
                    seen: true
                },
                methods:
                {
                    change: function(e)
                    {
                        this.seen = e.target.checked;
                    }
                }
            });
            var app106 = new Vue(
            {
                el: '#app-106',
                data:
                {
                    type: 'A'
                }
            });
            var app107 = new Vue(
            {
                el: '#app-107',
                data:
                {
                    colorList: ['Red', 'Green', 'Blue']
                }
            });
            var app108 = new Vue(
            {
                el: '#app-108',
                methods:
                {
                    hello: function()
                    {
                        alert("Hello");
                    }
                }
            });
            var app109 = new Vue(
            {
                el: '#app-109',
                data:
                {
                    message: 'Hello!'
                }
            });
        </script>
    </body>
</html>
